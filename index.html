<style>
/* Layout: a two-pane workbench, code on the left and the program's console, trace table and variables on the right. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#14202A; --muted:#536271; --rule:#D3DBE2; --rule-strong:#AEBBC6;
  --ps:#0A7570; --ps-soft:#E1F1EF; --py:#3344B3; --py-soft:#E6E9FA;
  --accent:var(--ps); --accent-soft:var(--ps-soft);
  --err:#B42318; --err-soft:#FDECEA; --warn:#8A5A00; --warn-soft:#FFF4DC; --ok:#1B7A44;
  --cur:#FFF1B8; --cur-gutter:#E8B900;
  --kw:#2F3FA8; --str:#9A4A00; --num:#0A6B4B; --com:#6E7C88; --fn:#8A2F8F; --op:#0A7570;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#151F28; --surface-2:#1A2630; --ink:#E1E8ED; --muted:#93A3B0; --rule:#283745; --rule-strong:#3B4D5D;
    --ps:#3FC2B6; --ps-soft:#14302F; --py:#97A3FF; --py-soft:#1F2547;
    --err:#FF8A7E; --err-soft:#3B1714; --warn:#F2C14E; --warn-soft:#352A10; --ok:#63D894;
    --cur:#3A3410; --cur-gutter:#E8B900;
    --kw:#9AA6FF; --str:#F0B072; --num:#6FD6A8; --com:#7D8D9A; --fn:#E39BEA; --op:#3FC2B6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#151F28; --surface-2:#1A2630; --ink:#E1E8ED; --muted:#93A3B0; --rule:#283745; --rule-strong:#3B4D5D;
  --ps:#3FC2B6; --ps-soft:#14302F; --py:#97A3FF; --py-soft:#1F2547;
  --err:#FF8A7E; --err-soft:#3B1714; --warn:#F2C14E; --warn-soft:#352A10; --ok:#63D894;
  --cur:#3A3410; --cur-gutter:#E8B900;
  --kw:#9AA6FF; --str:#F0B072; --num:#6FD6A8; --com:#7D8D9A; --fn:#E39BEA; --op:#3FC2B6;
  color-scheme:dark;
}
:root[data-lang="py"]{ --accent:var(--py); --accent-soft:var(--py-soft); }

*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html, body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--font); font-variant-ligatures:none; display:flex; flex-direction:column; height:100vh; height:100dvh; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:60; background:var(--surface); }
button, input, select, textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* Header and toolbar */
.top{ flex:none; position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; background:var(--surface); border-bottom:1px solid var(--rule); }
.top-in{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:10px; padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); }
.brand{ display:flex; align-items:baseline; gap:8px; white-space:nowrap; margin-right:6px; }
.brand b{ font-size:22px; letter-spacing:-0.02em; }
.brand span{ font-size:15px; color:var(--muted); }
.switch{ display:flex; background:var(--surface-2); border:1px solid var(--rule); border-radius:999px; padding:3px; }
.switch button{ border:0; background:transparent; padding:5px 14px; border-radius:999px; cursor:pointer; font-weight:700; font-size:14.5px; color:var(--muted); }
.switch button[aria-selected="true"][data-lang="ps"]{ background:var(--ps); color:var(--surface); }
.switch button[aria-selected="true"][data-lang="py"]{ background:var(--py); color:var(--surface); }
.tools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto; }
.btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--rule-strong); background:var(--surface-2); border-radius:9px; padding:7px 13px; cursor:pointer; font-weight:700; font-size:14.5px; line-height:1.2; white-space:nowrap; }
.btn:hover:not(:disabled){ border-color:var(--accent); }
.btn:disabled{ opacity:.45; cursor:default; }
.btn.run{ background:var(--accent); border-color:var(--accent); color:var(--surface); }
.btn.stop{ color:var(--err); }
.btn kbd{ font:600 11px var(--mono); opacity:.75; }
.sel{ border:1px solid var(--rule-strong); background:var(--surface-2); border-radius:9px; padding:7px 10px; font-size:14.5px; max-width:230px; }
.icon-btn{ border:1px solid var(--rule); background:var(--surface-2); width:36px; height:36px; border-radius:9px; display:grid; place-items:center; cursor:pointer; flex:none; }

/* Workbench */
.bench{ display:grid; grid-template-columns:minmax(0, 1.12fr) minmax(0, 0.88fr); gap:14px; padding-block:14px 18px; padding-left:max(20px, env(safe-area-inset-left, 0px)); padding-right:max(20px, env(safe-area-inset-right, 0px)); flex:1 0 auto; height:0; min-height:520px; }
.card{ background:var(--surface); border:1px solid var(--rule); border-radius:var(--r); display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
.card-h{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--rule); background:var(--surface-2); font-size:14px; min-height:42px; }
.card-h .ttl{ font-weight:700; }
.card-h .file{ font-family:var(--mono); font-size:13px; color:var(--muted); }
.card-h .sp{ margin-left:auto; }
.mini{ border:1px solid var(--rule); background:var(--surface); border-radius:7px; padding:3px 9px; cursor:pointer; font-size:13px; font-weight:600; }
.left{ display:flex; flex-direction:column; gap:0; min-height:0; }
.editor-wrap{ flex:1; min-height:0; position:relative; }
.editor-wrap .CodeMirror{ position:absolute; inset:0; height:100%; }
.editor-wrap textarea.fallback{ position:absolute; inset:0; width:100%; height:100%; border:0; padding:12px; font:14.5px/1.6 var(--mono); background:var(--surface); color:var(--ink); resize:none; }
.statusbar{ display:flex; gap:14px; align-items:center; padding:7px 12px; border-top:1px solid var(--rule); font-size:13.5px; color:var(--muted); background:var(--surface-2); flex-wrap:wrap; }
.pill{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--ink); }
.pill::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--rule-strong); }
.pill[data-s="run"]::before{ background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.pill[data-s="pause"]::before, .pill[data-s="input"]::before{ background:var(--cur-gutter); }
.pill[data-s="done"]::before{ background:var(--ok); }
.pill[data-s="err"]::before{ background:var(--err); }
.right{ display:grid; grid-template-rows:minmax(160px, 0.9fr) minmax(200px, 1.1fr); gap:14px; min-height:0; }

/* Console */
.console{ flex:1; overflow:auto; padding:10px 14px; font:14px/1.55 var(--mono); white-space:pre-wrap; word-break:break-word; }
.console .o{ display:block; }
.console .in{ color:var(--accent); }
.console .sys{ color:var(--muted); font-family:var(--font); font-size:13.5px; }
.console .warn{ display:block; color:var(--warn); background:var(--warn-soft); border-radius:6px; padding:4px 8px; margin:4px 0; font-family:var(--font); font-size:13.5px; }
.console .error{ display:block; color:var(--err); background:var(--err-soft); border-radius:8px; padding:8px 10px; margin:6px 0; font-family:var(--font); font-size:14px; white-space:normal; }
.console .error b{ display:block; }
.console .error .hint{ display:block; color:var(--ink); margin-top:4px; }
.console .empty{ color:var(--muted); font-family:var(--font); font-size:14px; }
.inrow{ display:none; gap:8px; padding:8px 10px; border-top:1px solid var(--rule); background:var(--accent-soft); align-items:center; flex-wrap:wrap; }
.inrow.on{ display:flex; }
.inrow label{ font-size:13.5px; font-weight:700; color:var(--accent); }
.inrow input{ flex:1; min-width:120px; border:1.5px solid var(--accent); background:var(--surface); border-radius:8px; padding:6px 10px; font:14px var(--mono); }

/* Panels */
.tabs{ display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
.tabs button{ white-space:nowrap; border:0; background:transparent; padding:6px 11px; border-radius:7px; cursor:pointer; font-weight:700; font-size:13.5px; color:var(--muted); }
.tabs button[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--rule); }
.panel{ flex:1; overflow:auto; min-height:0; }
.panel[hidden]{ display:none; }
table.tt{ border-collapse:collapse; font:13px var(--mono); min-width:100%; }
.tt th, .tt td{ border-bottom:1px solid var(--rule); border-right:1px solid var(--rule); padding:5px 9px; text-align:center; white-space:nowrap; }
.tt thead th{ position:sticky; top:0; background:var(--surface-2); font-weight:600; z-index:1; }
.tt td.out{ text-align:left; color:var(--accent); }
.tt td.new{ background:var(--accent-soft); font-weight:600; }
.tt th:first-child, .tt td:first-child{ color:var(--muted); }
.vars td, .vars th{ text-align:left; }
.vars td.v{ white-space:pre-wrap; word-break:break-word; max-width:320px; }
.vars td.t{ color:var(--muted); font-family:var(--font); font-size:12.5px; }
.note{ padding:12px 14px; color:var(--muted); font-size:14px; }
.files{ padding:10px 12px; display:flex; flex-direction:column; gap:12px; }
.fileitem{ border:1px solid var(--rule); border-radius:10px; overflow:hidden; }
.fileitem header{ display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--surface-2); font:600 13px var(--mono); }
.fileitem header .sp{ margin-left:auto; }
.fileitem textarea{ width:100%; border:0; min-height:90px; padding:8px 10px; font:13px/1.55 var(--mono); background:var(--surface); color:var(--ink); resize:vertical; display:block; }
.newfile{ display:flex; gap:8px; }
.newfile input{ flex:1; min-width:0; border:1px solid var(--rule-strong); border-radius:8px; padding:6px 10px; font:13px var(--mono); background:var(--surface-2); }
.ref{ padding:12px 16px 20px; font-size:14px; }
.ref h3{ font-size:15px; margin:14px 0 6px; }
.ref h3:first-child{ margin-top:2px; }
.ref pre{ background:var(--surface-2); border:1px solid var(--rule); border-radius:8px; padding:8px 10px; font:12.5px/1.55 var(--mono); overflow-x:auto; margin:4px 0 8px; }
.ref p{ margin:4px 0 8px; max-width:62ch; }
.ref code{ font:12.5px var(--mono); background:var(--surface-2); border:1px solid var(--rule); border-radius:4px; padding:0 4px; }

/* CodeMirror theme */
.CodeMirror{ font:14.5px/1.65 var(--mono); background:var(--surface); color:var(--ink); }
.CodeMirror-gutters{ background:var(--surface-2); border-right:1px solid var(--rule); }
.CodeMirror-linenumber{ color:var(--muted); padding:0 8px 0 4px; }
.CodeMirror-cursor{ border-left:2px solid var(--ink); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected{ background:var(--accent-soft) !important; }
.CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection{ background:var(--accent-soft); }
.cm-keyword{ color:var(--kw); font-weight:600; }
.cm-builtin{ color:var(--fn); }
.cm-string, .cm-string-2{ color:var(--str); }
.cm-number{ color:var(--num); }
.cm-comment{ color:var(--com); font-style:italic; }
.cm-operator.cm-arrow{ color:var(--op); font-weight:600; }
.cm-def{ color:var(--fn); font-weight:600; }
.cm-variable-2, .cm-variable-3, .cm-type{ color:var(--num); }
.cm-atom{ color:var(--kw); }
.cm-cur-line{ background:var(--cur); }
.cm-cur-gutter{ background:var(--cur-gutter); }
.cm-cur-gutter .CodeMirror-linenumber{ color:#14202A; font-weight:700; }
.cm-err-line{ background:var(--err-soft); }
.cm-err-gutter{ background:var(--err); }
.cm-err-gutter .CodeMirror-linenumber{ color:#fff; font-weight:700; }

/* Responsive */
@media (max-width: 1400px){ .btn kbd{ display:none; } }
@media (max-width: 980px){
  body{ height:auto; display:block; }
  .bench{ grid-template-columns:1fr; height:auto; }
  .left{ height:62vh; min-height:360px; }
  .right{ grid-template-rows:auto auto; }
  .right .card:first-child{ height:260px; }
  .right .card:last-child{ height:420px; }
  .tools{ margin-left:0; width:100%; }
}
@media (max-width: 560px){
  .top-in{ gap:8px; }
  .brand b{ font-size:19px; }
  .brand span{ font-size:14px; }
  #themeBtn{ order:1; margin-left:auto; }
  .switch{ order:2; }
  .tools{ order:3; }
  #examples{ max-width:none; flex:1 1 52%; min-width:0; order:-2; }
  #speed{ max-width:none; flex:none; order:-1; }
  .btn{ padding:7px 11px; }
  .tabs button{ padding:6px 8px; }
  .card-h{ padding:8px 10px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

<header class="top">
  <div class="top-in">
    <div class="brand"><b>9618</b><span>Code Playground</span></div>
    <div class="switch" role="tablist" aria-label="Language">
      <button role="tab" data-lang="ps" aria-selected="true" id="tab-ps">Pseudocode</button>
      <button role="tab" data-lang="py" aria-selected="false" id="tab-py">Python</button>
    </div>
    <div class="tools">

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<script>
/* Cambridge 9618 pseudocode interpreter.
   compile(source) -> program (throws PseudoError)
   new Machine(program, io).run() -> Promise; io = { output(text), input(label) -> Promise<string>,
   tick(line, machine) -> Promise|undefined, onEvent(evt), files: Map<string,string[]> } */
(function (root) {
"use strict";

class PseudoError extends Error {
  constructor(line, message, hint) { super(message); this.line = line; this.hint = hint || ""; }
}
class StopSignal extends Error { constructor() { super("Stopped"); } }
class ReturnSignal { constructor(value) { this.value = value; } }

const KEYWORDS = new Set(("DECLARE CONSTANT ARRAY OF INTEGER REAL CHAR STRING BOOLEAN DATE TYPE ENDTYPE IF THEN ELSE ENDIF " +
  "CASE OTHERWISE ENDCASE FOR TO STEP NEXT WHILE DO ENDWHILE REPEAT UNTIL PROCEDURE ENDPROCEDURE FUNCTION RETURNS RETURN " +
  "ENDFUNCTION CALL BYREF BYVAL INPUT OUTPUT OPENFILE READFILE WRITEFILE CLOSEFILE READ WRITE APPEND RANDOM AND OR NOT MOD DIV TRUE FALSE").split(" "));
const BASE_TYPES = new Set(["INTEGER", "REAL", "CHAR", "STRING", "BOOLEAN", "DATE"]);
const BUILTINS = new Set(["LENGTH", "LEFT", "RIGHT", "MID", "SUBSTRING", "TO_UPPER", "TO_LOWER", "UCASE", "LCASE", "NUM_TO_STR", "STR_TO_NUM",
  "IS_NUM", "ASC", "CHR", "INT", "RAND", "ROUND", "MOD", "DIV", "EOF"]);
const UNSET = Symbol("unset");

/* ---------------- Lexer ---------------- */
function lex(src) {
  const toks = []; let line = 1, i = 0;
  const push = (t, v, extra) => toks.push(Object.assign({ t, v, line }, extra || {}));
  src = src.replace(/\r\n?/g, "\n").replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
  while (i < src.length) {
    const c = src[i];
    if (c === "\n") { if (toks.length && toks[toks.length - 1].t !== "nl") push("nl"); line++; i++; continue; }
    if (c === " " || c === "\t") { i++; continue; }
    if (c === "/" && src[i + 1] === "/") { while (i < src.length && src[i] !== "\n") i++; continue; }
    if (/[0-9]/.test(c)) {
      let j = i; while (/[0-9]/.test(src[j])) j++;
      let real = false;
      if (src[j] === "." && /[0-9]/.test(src[j + 1])) { real = true; j++; while (/[0-9]/.test(src[j])) j++; }
      push("num", Number(src.slice(i, j)), { real }); i = j; continue;
    }
    if (c === '"') {
      let j = i + 1; while (j < src.length && src[j] !== '"' && src[j] !== "\n") j++;
      if (src[j] !== '"') throw new PseudoError(line, "This string has no closing double quote \".");
      push("str", src.slice(i + 1, j)); i = j + 1; continue;
    }
    if (c === "'") {
      let j = i + 1; while (j < src.length && src[j] !== "'" && src[j] !== "\n") j++;
      if (src[j] !== "'") throw new PseudoError(line, "This character has no closing single quote '.");
      const s = src.slice(i + 1, j);
      if (s.length !== 1) throw new PseudoError(line, `'${s}' is not a single character.`, "Single quotes are for one CHAR, such as 'A'. Use double quotes for a STRING, such as \"" + s + "\".");
      push("chr", s); i = j + 1; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j);
      if (KEYWORDS.has(w)) push("kw", w); else push("id", w);
      i = j; continue;
    }
    const two = src.slice(i, i + 2);
    if (two === "<-") { push("op", "←"); i += 2; continue; }
    if (["<=", ">=", "<>"].includes(two)) { push("op", two); i += 2; continue; }
    if (c === "≤") { push("op", "<="); i++; continue; }
    if (c === "≥") { push("op", ">="); i++; continue; }
    if (c === "≠") { push("op", "<>"); i++; continue; }
    if ("←=<>+-*/^&()[],:.".includes(c)) { push("op", c); i++; continue; }
    throw new PseudoError(line, `I don't recognise the character "${c}".`);
  }
  if (toks.length && toks[toks.length - 1].t !== "nl") push("nl");
  push("eof");
  return toks;
}

/* ---------------- Parser ---------------- */
function compile(src) {
  const toks = lex(src);
  let p = 0;
  const peek = (o = 0) => toks[p + o];
  const next = () => toks[p++];
  const isKw = (w, o = 0) => peek(o).t === "kw" && peek(o).v === w;
  const isOp = (v, o = 0) => peek(o).t === "op" && peek(o).v === v;
  const lineOf = () => peek().line;
  function describe(t) {
    if (t.t === "nl") return "the end of the line";
    if (t.t === "eof") return "the end of the program";
    if (t.t === "str") return `"${t.v}"`;
    if (t.t === "chr") return `'${t.v}'`;
    return `"${t.v}"`;
  }
  function expectKw(w, msg, hint) {
    if (isKw(w)) return next();
    const t = peek();
    if (t.t === "id" && t.v.toUpperCase() === w) throw new PseudoError(t.line, `Keywords must be in capitals: write ${w}, not ${t.v}.`);
    throw new PseudoError(t.line, msg || `Expected ${w} but found ${describe(t)}.`, hint);
  }
  function expectOp(v, msg, hint) {
    if (isOp(v)) return next();
    throw new PseudoError(peek().line, msg || `Expected "${v}" but found ${describe(peek())}.`, hint);
  }
  function expectId(what) {
    const t = peek();
    if (t.t === "id") return next().v;
    if (t.t === "kw") throw new PseudoError(t.line, `${t.v} is a keyword, so it can't be used as ${what}.`);
    throw new PseudoError(t.line, `Expected ${what} but found ${describe(t)}.`);
  }
  function endLine() {
    if (peek().t === "nl") { next(); return; }
    if (peek().t === "eof") return;
    const t = peek();
    let hint = "";
    if (t.t === "op" && t.v === "=") hint = "Use ← (or type <-) for assignment. = is only for comparing values.";
    throw new PseudoError(t.line, `Unexpected ${describe(t)} here.`, hint);
  }
  function skipNl() { while (peek().t === "nl") next(); }

  /* types */
  function parseType() {
    const t = peek();
    if (t.t === "kw" && BASE_TYPES.has(t.v)) { next(); return { base: t.v }; }
    if (isKw("ARRAY")) {
      next(); expectOp("[", "Expected [ after ARRAY, as in ARRAY[1:10] OF INTEGER.");
      const bounds = [];
      do { const lo = parseExpr(); expectOp(":", "Array bounds are written lower:upper, as in [1:10]."); const hi = parseExpr(); bounds.push([lo, hi]); } while (isOp(",") && next());
      expectOp("]"); expectKw("OF", "Expected OF after the array bounds, as in ARRAY[1:10] OF INTEGER.");
      const elem = parseType();
      if (elem.array) throw new PseudoError(t.line, "Use ARRAY[1:3, 1:4] for a 2D array, not an array of arrays.");
      return { array: true, bounds, elem };
    }
    if (t.t === "id") { next(); return { user: t.v }; }
    if (t.t === "id" || (t.t === "kw")) throw new PseudoError(t.line, `${t.v} is not a data type.`);
    throw new PseudoError(t.line, `Expected a data type (INTEGER, REAL, CHAR, STRING, BOOLEAN, ARRAY…) but found ${describe(t)}.`);
  }

  /* expressions */
  function parseExpr() { return parseOr(); }
  function bin(op, l, r, line) { return { k: "bin", op, l, r, line }; }
  function parseOr() { let l = parseAnd(); while (isKw("OR")) { const line = next().line; l = bin("OR", l, parseAnd(), line); } return l; }
  function parseAnd() { let l = parseNot(); while (isKw("AND")) { const line = next().line; l = bin("AND", l, parseNot(), line); } return l; }
  function parseNot() { if (isKw("NOT")) { const line = next().line; return { k: "un", op: "NOT", e: parseNot(), line }; } return parseCmp(); }
  function parseCmp() {
    let l = parseConcat();
    if (peek().t === "op" && ["=", "<>", "<", ">", "<=", ">="].includes(peek().v)) { const t = next(); l = bin(t.v, l, parseConcat(), t.line); }
    if (peek().t === "op" && ["=", "<>", "<", ">", "<=", ">="].includes(peek().v)) throw new PseudoError(peek().line, "Comparisons can't be chained like a < b < c.", "Write (a < b) AND (b < c).");
    return l;
  }
  function parseConcat() { let l = parseAdd(); while (isOp("&")) { const line = next().line; l = bin("&", l, parseAdd(), line); } return l; }
  function parseAdd() { let l = parseMul(); while (isOp("+") || isOp("-")) { const t = next(); l = bin(t.v, l, parseMul(), t.line); } return l; }
  function parseMul() {
    let l = parsePow();
    while (isOp("*") || isOp("/") || (isKw("DIV") && !isOp("(", 1)) || (isKw("MOD") && !isOp("(", 1))) { const t = next(); l = bin(t.v, l, parsePow(), t.line); }
    return l;
  }
  function parsePow() { const l = parseUnary(); if (isOp("^")) { const line = next().line; return bin("^", l, parsePow(), line); } return l; }
  function parseUnary() {
    if (isOp("-")) { const line = next().line; return { k: "un", op: "-", e: parseUnary(), line }; }
    if (isOp("+")) { next(); return parseUnary(); }
    return parsePostfix(parsePrimary());
  }
  function parseArgs() {
    const args = []; expectOp("(");
    if (!isOp(")")) { do { args.push(parseExpr()); } while (isOp(",") && next()); }
    expectOp(")", "Expected ) to close the list of arguments.");
    return args;
  }
  function parsePrimary() {
    const t = peek();
    if (t.t === "num") { next(); return { k: "lit", v: t.v, real: t.real, line: t.line }; }
    if (t.t === "str") { next(); return { k: "lit", v: t.v, str: true, line: t.line }; }
    if (t.t === "chr") { next(); return { k: "lit", v: t.v, chr: true, line: t.line }; }
    if (isKw("TRUE") || isKw("FALSE")) { next(); return { k: "lit", v: t.v === "TRUE", line: t.line }; }
    if ((isKw("MOD") || isKw("DIV") || isKw("EOF")) && isOp("(", 1)) { next(); return { k: "call", name: t.v, args: parseArgs(), line: t.line }; }
    if (isOp("(")) { next(); const e = parseExpr(); expectOp(")", "A bracket ( is never closed."); return e; }
    if (t.t === "id") {
      next();
      if (isOp("(")) return { k: "call", name: t.v, args: parseArgs(), line: t.line };
      return { k: "var", name: t.v, line: t.line };
    }
    if (t.t === "kw") throw new PseudoError(t.line, `${t.v} can't be used inside an expression here.`, KEYWORDS.has(t.v) && /^END|^NEXT$|^UNTIL$/.test(t.v) ? "Check that the line before is complete." : "");
    throw new PseudoError(t.line, `Expected a value or variable but found ${describe(t)}.`);
  }
  function parsePostfix(e) {
    for (;;) {
      if (isOp("[")) {
        const line = next().line; const idx = [];
        do { idx.push(parseExpr()); } while (isOp(",") && next());
        expectOp("]", "Expected ] to close the array index.");
        e = { k: "index", target: e, idx, line };
      } else if (isOp(".")) {
        const line = next().line; e = { k: "field", target: e, name: expectId("a field name"), line };
      } else return e;
    }
  }
  function parseLvalue(what) {
    const t = peek();
    if (t.t !== "id") {
      if (t.t === "kw") throw new PseudoError(t.line, `${t.v} is a keyword, so it can't be used as ${what || "a variable"}.`);
      throw new PseudoError(t.line, `Expected ${what || "a variable"} but found ${describe(t)}.`);
    }
    next(); return parsePostfix({ k: "var", name: t.v, line: t.line });
  }

  /* statements */
  const TERMS = new Set(["ENDIF", "ELSE", "ENDCASE", "OTHERWISE", "NEXT", "ENDWHILE", "UNTIL", "ENDPROCEDURE", "ENDFUNCTION", "ENDTYPE", "THEN"]);
  function parseBlock(terms, opener) {
    const body = [];
    for (;;) {
      skipNl();
      const t = peek();
      if (t.t === "eof") {
        if (!opener) return body;
        throw new PseudoError(opener.line, `This ${opener.kw} is never closed: ${terms.join(" or ")} is missing.`);
      }
      if (t.t === "kw" && terms.includes(t.v)) return body;
      if (t.t === "kw" && TERMS.has(t.v)) {
        throw new PseudoError(t.line, opener ? `Found ${t.v} but the ${opener.kw} on line ${opener.line} needs ${terms.join(" or ")} first.` : `Found ${t.v}, but there is no matching ${{ ENDIF: "IF", ELSE: "IF", ENDCASE: "CASE", OTHERWISE: "CASE", NEXT: "FOR", ENDWHILE: "WHILE", UNTIL: "REPEAT", ENDPROCEDURE: "PROCEDURE", ENDFUNCTION: "FUNCTION", ENDTYPE: "TYPE", THEN: "IF" }[t.v]} for it.`);
      }
      body.push(parseStatement(!!opener));
    }
  }
  function parseParams() {
    const params = [];
    if (!isOp("(")) return params;
    next();
    let mode = "BYVAL";
    if (!isOp(")")) {
      do {
        if (isKw("BYREF") || isKw("BYVAL")) mode = next().v;
        const name = expectId("a parameter name");
        let type = null;
        if (isOp(":")) { next(); type = parseType(); }
        params.push({ name, type, byref: mode === "BYREF" });
      } while (isOp(",") && next());
    }
    expectOp(")", "Expected ) to close the parameter list.");
    return params;
  }
  function lowerKeywordHint(t) {
    if (t.t === "id" && KEYWORDS.has(t.v.toUpperCase()) && t.v !== t.v.toUpperCase()) return `Keywords must be in capitals: write ${t.v.toUpperCase()}, not ${t.v}.`;
    if (t.t === "id" && t.v.toLowerCase() === "print") return "Use OUTPUT to display values in Cambridge pseudocode.";
    if (t.t === "id" && t.v.toUpperCase() === "ELSEIF") return "There is no ELSEIF. Write ELSE, then a new IF … ENDIF inside it.";
    if (t.t === "id" && t.v.toUpperCase() === "END") return "Block endings are single words: ENDIF, ENDWHILE, ENDCASE, ENDPROCEDURE, ENDFUNCTION.";
    return "";
  }
  function parseStatement(nested) {
    const t = peek(), line = t.line;
    if (t.t === "kw") {
      switch (t.v) {
        case "DECLARE": {
          next(); const names = [expectId("a variable name")];
          while (isOp(",")) { next(); names.push(expectId("a variable name")); }
          expectOp(":", "Expected : after the variable name, as in DECLARE Count : INTEGER.");
          const type = parseType(); endLine();
          return { k: "declare", names, type, line };
        }
        case "CONSTANT": {
          next(); const name = expectId("a constant name");
          if (!(isOp("=") || isOp("←"))) throw new PseudoError(line, "Expected = after the constant name, as in CONSTANT Pi = 3.142.");
          next(); const value = parseExpr(); endLine();
          return { k: "const", name, value, line };
        }
        case "TYPE": {
          if (nested) throw new PseudoError(line, "TYPE definitions must be at the top level of the program.");
          next(); const name = expectId("a type name");
          if (isOp("=")) {
            next(); expectOp("(", "Expected ( to start the list of values, as in TYPE Season = (Spring, Summer).");
            const values = []; do { values.push(expectId("a value name")); } while (isOp(",") && next());
            expectOp(")"); endLine();
            return { k: "enum", name, values, line };
          }
          endLine();
          const fields = [];
          for (;;) {
            skipNl();
            if (isKw("ENDTYPE")) { next(); endLine(); break; }
            if (peek().t === "eof") throw new PseudoError(line, `TYPE ${name} is never closed with ENDTYPE.`);
            expectKw("DECLARE", `Inside a TYPE, each field is written DECLARE Name : Type.`);
            const fnames = [expectId("a field name")]; while (isOp(",")) { next(); fnames.push(expectId("a field name")); }
            expectOp(":"); const ft = parseType(); endLine();
            fnames.forEach(f => fields.push({ name: f, type: ft }));
          }
          return { k: "record", name, fields, line };
        }
        case "INPUT": { next(); const target = parseLvalue("a variable to store the input"); endLine(); return { k: "input", target, line }; }
        case "OUTPUT": {
          next(); const items = [parseExpr()];
          while (isOp(",")) { next(); items.push(parseExpr()); }
          endLine(); return { k: "output", items, line };
        }
        case "IF": {
          next(); const cond = parseExpr();
          if (peek().t === "nl" && !isKw("THEN", 1)) throw new PseudoError(line, "Expected THEN after the IF condition.", "Write IF condition THEN, with THEN at the end of the line or on the next line.");
          skipNl();
          expectKw("THEN", "Expected THEN after the IF condition.");
          const opener = { kw: "IF", line };
          let then;
          if (peek().t !== "nl") { then = [parseStatement(true)]; then = then.concat(parseBlock(["ELSE", "ENDIF"], opener)); }
          else then = parseBlock(["ELSE", "ENDIF"], opener);
          let els = null;
          if (isKw("ELSE")) {
            next();
            if (peek().t !== "nl") { els = [parseStatement(true)]; els = els.concat(parseBlock(["ENDIF"], opener)); }
            else els = parseBlock(["ENDIF"], opener);
          }
          expectKw("ENDIF"); endLine();
          return { k: "if", cond, then, els, line };
        }
        case "CASE": {
          next(); expectKw("OF", "Expected OF, as in CASE OF Choice.");
          const subject = parseExpr(); endLine();
          const clauses = []; let otherwise = null, cur = null;
          const opener = { kw: "CASE", line };
          for (;;) {
            skipNl();
            if (isKw("ENDCASE")) { next(); endLine(); break; }
            if (peek().t === "eof") throw new PseudoError(line, "This CASE is never closed: ENDCASE is missing.");
            if (isKw("OTHERWISE")) {
              const ol = next().line; if (isOp(":")) next();
              cur = { body: [], line: ol }; otherwise = cur;
              if (peek().t !== "nl") cur.body.push(parseStatement(true));
              continue;
            }
            const save = p;
            let label = null;
            const lt = peek();
            if (lt.t === "num" || lt.t === "str" || lt.t === "chr" || isKw("TRUE") || isKw("FALSE") || isOp("-") || (lt.t === "id" && (isOp(":", 1) || isKw("TO", 1)))) {
              try {
                const a = parseConcat(); let b = null;
                if (isKw("TO")) { next(); b = parseConcat(); }
                if (isOp(":")) { next(); label = { a, b }; }
              } catch (e) { label = null; }
            }
            if (label) {
              if (otherwise) throw new PseudoError(lt.line, "OTHERWISE must be the last option in a CASE.");
              cur = { label, body: [], line: lt.line }; clauses.push(cur);
              if (peek().t !== "nl") cur.body.push(parseStatement(true));
              continue;
            }
            p = save;
            if (!cur) throw new PseudoError(peek().line, "Each option in a CASE starts with a value and a colon, such as 1 : OUTPUT \"One\".");
            const tt = peek();
            if (tt.t === "kw" && TERMS.has(tt.v)) throw new PseudoError(tt.line, `Found ${tt.v} inside the CASE that starts on line ${opener.line}; ENDCASE is needed first.`);
            cur.body.push(parseStatement(true));
          }
          return { k: "case", subject, clauses, otherwise, line };
        }
        case "FOR": {
          next(); const v = expectId("a loop counter");
          if (!(isOp("←") || isOp("="))) throw new PseudoError(line, "Expected ← after the loop counter, as in FOR Count ← 1 TO 10.");
          next(); const from = parseExpr();
          expectKw("TO", "Expected TO in the FOR loop, as in FOR Count ← 1 TO 10.");
          const to = parseExpr(); let step = null;
          if (isKw("STEP")) { next(); step = parseExpr(); }
          endLine();
          const body = parseBlock(["NEXT"], { kw: "FOR", line });
          next();
          if (peek().t === "id") { const nv = next(); if (nv.v !== v) throw new PseudoError(nv.line, `NEXT ${nv.v} doesn't match the loop counter ${v} of the FOR on line ${line}.`); }
          endLine();
          return { k: "for", v, from, to, step, body, line };
        }
        case "WHILE": {

      case "STR_TO_NUM": { need(1); const s = str(args[0], 1).trim(); if (s === "" || isNaN(Number(s))) throw this.err(`STR_TO_NUM can't convert "${args[0]}" to a number.`, "Check it first with IS_NUM(…)."); return Number(s); }

      case "ASC": { need(1); const s = str(args[0], 1); if (s.length !== 1) throw this.err(`ASC needs a single CHAR, but got "${s}".`); return s.charCodeAt(0); }
      case "CHR": { need(1); const k = int(args[0], 1); if (k < 0 || k > 65535) throw this.err(`${k} is not a valid character code.`); return String.fromCharCode(k); }
      case "INT": need(1); return Math.trunc(numv(args[0], 1));
      case "RAND": need(1); return Math.random() * numv(args[0], 1);
      case "ROUND": { need(2); const x = numv(args[0], 1), d = int(args[1], 2); const f = Math.pow(10, d); return Math.round(x * f) / f; }
      case "MOD": case "DIV": { need(2); const a = args[0], b = args[1];
        if (!Number.isInteger(a) || !Number.isInteger(b)) throw this.err(`${name} needs two INTEGER values.`);
        if (b === 0) throw this.err(`${name} by zero.`); return name === "DIV" ? Math.trunc(a / b) : a % b; }
      case "EOF": { need(1); const f = this.fileOpen(str(args[0], 1), "READ"); return f.pos >= this.files.get(f.name).length; }
    }
    throw this.err(`Unknown function ${name}.`);

  /* files */
  fileOpen(name, mode) {
    const f = this.open.get(name);
    if (!f) throw this.err(`The file "${name}" is not open.`, `Use OPENFILE "${name}" FOR ${mode} first.`);
    if (mode && f.mode !== mode && !(mode === "WRITE" && f.mode === "APPEND")) throw this.err(`"${name}" is open for ${f.mode}, not ${mode}.`);

  async execBlock(stmts) { for (const s of stmts) await this.exec(s); }

        const r = await this.ref(s.target, true);

        if (this.stopped) throw new StopSignal();
        let v = raw;
        const t = r.type && r.type.base;
        if (t === "INTEGER" || t === "REAL") {

          if (String(raw).trim() === "" || isNaN(x) || (t === "INTEGER" && !Number.isInteger(x))) throw this.err(`"${raw}" is not a valid ${t} for ${r.label}.`);

          if (u !== "TRUE" && u !== "FALSE") throw this.err(`"${raw}" is not a BOOLEAN. Enter TRUE or FALSE.`);
          v = u === "TRUE";
        } else if (t === "CHAR") {
          if (String(raw).length !== 1) throw this.err(`"${raw}" is not a single CHAR for ${r.label}.`);
        } else if (!r.type) {
          const x = Number(String(raw).trim());
          if (String(raw).trim() !== "" && !isNaN(x)) v = x;

            if (typeof a !== typeof v || typeof b !== typeof v) throw this.err(`The CASE value ${show(v)} can't be compared with the range ${show(a)} TO ${show(b)}.`, "", cl.line);

            hit = va === aa;

          if (hit) { await this.execBlock(cl.body); return; }
        }
        if (s.otherwise) await this.execBlock(s.otherwise.body);
        return;
      }
      case "for": {
        const from = await this.eval(s.from), to = await this.eval(s.to);
        const step = s.step ? await this.eval(s.step) : 1;
        for (const [x, w] of [[from, "start"], [to, "end"], [step, "STEP"]]) if (typeof x !== "number") throw this.err(`The ${w} value of the FOR loop must be a number, but it is ${show(x)}.`);
        if (step === 0) throw this.err("STEP 0 would loop for ever.");
        const r = await this.ref({ k: "var", name: s.v, line: s.line }, true);
        let i = from;
        while (step > 0 ? i <= to : i >= to) {
          r.set(i); this.event({ type: "assign", label: s.v, value: i });
          await this.execBlock(s.body);
          i += step;
          if (s.body.length === 0) await this.tick(s.line);
        }
        return;
      }
      case "while": {
        for (;;) {
          const c = await this.eval(s.cond);
          if (typeof c !== "boolean") throw this.err(`A WHILE condition must be TRUE or FALSE, but this one gives ${show(c)}.`);
          if (!c) return;
          await this.execBlock(s.body);
          await this.tick(s.line);
        }
      }
      case "repeat": {
        for (;;) {
          await this.execBlock(s.body);
          await this.tick(s.untilLine);
          const c = await this.eval(s.cond);
          if (typeof c !== "boolean") throw this.err(`An UNTIL condition must be TRUE or FALSE, but this one gives ${show(c)}.`);
          if (c) return;
        }
      }
      case "call": {
        const def = this.prog.procs[s.name];
        if (!def) {
          if (this.prog.funcs[s.name]) throw this.err(`${s.name} is a FUNCTION. Use it in an expression, such as X ← ${s.name}(…).`);
          throw this.err(`There is no procedure called ${s.name}.`);
        }
        await this.invoke(def, s.args, false);
        return;
      }
      case "return": {
        const f = this.scope;
        if (!f) throw this.err("RETURN can only be used inside a FUNCTION or PROCEDURE.");
        if (f.isFunc && !s.value) throw this.err("A FUNCTION must RETURN a value.");
        if (!f.isFunc && s.value) throw this.err("A PROCEDURE can't return a value. Use a FUNCTION instead.");
        throw new ReturnSignal(s.value ? await this.eval(s.value) : undefined);
      }
      case "openfile": {
        const name = await this.eval(s.file);
        if (typeof name !== "string") throw this.err("The file name must be a STRING.");
        if (this.open.has(name)) throw this.err(`"${name}" is already open.`, "Close it with CLOSEFILE before opening it again.");
        if (s.mode === "RANDOM") throw this.err("Random-access files are not supported in the playground.");
        if (s.mode === "READ" && !this.files.has(name)) throw this.err(`The file "${name}" doesn't exist.`, "Create it in the Files tab, or check the spelling and capitals.");
        if (s.mode === "WRITE" || !this.files.has(name)) this.files.set(name, []);
        this.open.set(name, { name, mode: s.mode, pos: 0 });
        this.event({ type: "file", name });
        return;
      }
      case "readfile": {
        const name = await this.eval(s.file); const f = this.fileOpen(name, "READ"); const lines = this.files.get(name);
        if (f.pos >= lines.length) throw this.err(`There are no more lines to read in "${name}".`, `Check EOF("${name}") before reading.`);
        const v = lines[f.pos++];
        const r = await this.ref(s.target, true); r.set(v);
        this.event({ type: "assign", label: r.label, value: v });
        return;
      }
      case "writefile": {
        const name = await this.eval(s.file); const f = this.fileOpen(name, "WRITE");
        const v = await this.eval(s.value);
        if (v && (v.arr || v.rec)) throw this.err("Write fields or elements one at a time.");
        this.files.get(name).push(fmt(v));
        this.event({ type: "file", name });
        return;
      }
      case "closefile": {
        const name = await this.eval(s.file);
        if (!this.open.has(name)) throw this.err(`"${name}" is not open, so it can't be closed.`);
        this.open.delete(name); return;
      }
    }
  }
  event(e) { this.io.onEvent && this.io.onEvent(e); }

  snapshot() {
    const vis = (map, scope) => {
      const out = [];
      for (const [name, s] of map) {
        if (s.kind === "ref") { let val; try { val = s.r.get(); } catch (e) { val = UNSET; } out.push({ name, scope, type: "BYREF " + (s.type ? typeName(s.type) : ""), value: show(val) }); continue; }
        if (s.kind === "const" && s.value && s.value.enumv) continue;
        out.push({ name, scope, type: s.kind === "const" ? "CONSTANT" : (s.type ? typeName(s.type) : (s.inferred || "?") + " (undeclared)"), value: show(s.value) });
      }
      return out;
    };
    const res = [];
    if (this.scope) res.push(...vis(this.scope.vars, this.scope.name));
    res.push(...vis(this.globals, "global"));
    return res;
  }

  async run() {
    for (const r of Object.values(this.prog.types)) for (const f of r.fields) if (f.type.array) f.type = await this.resolveType(f.type);
    await this.execBlock(this.prog.body);
    if (this.open.size) this.warn("open", `Some files were not closed: ${[...this.open.keys()].join(", ")}. Use CLOSEFILE.`);

}

<script>
/* Fixes for Skulpt so its output matches real Python 3. */
window.patchSkulpt = function (Sk) {
  if (!Sk || Sk.__patched9618) return;
  Sk.__patched9618 = true;
  // Skulpt prints floats with 16 significant digits (73.4 shows as 73.40000000000001).
  // Python prints the shortest text that reads back as the same number.
  function pyFloatRepr(x) {
    if (x === 0) return 1 / x < 0 ? "-0.0" : "0.0";
    const neg = x < 0, parts = Math.abs(x).toExponential().split("e");
    const exp = parseInt(parts[1], 10), digits = parts[0].replace(".", "");
    let s;
    if (exp < -4 || exp >= 16) s = digits[0] + (digits.length > 1 ? "." + digits.slice(1) : "") + "e" + (exp < 0 ? "-" : "+") + String(Math.abs(exp)).padStart(2, "0");
    else if (exp < 0) s = "0." + "0".repeat(-exp - 1) + digits;
    else if (digits.length <= exp + 1) s = digits + "0".repeat(exp + 1 - digits.length) + ".0";
    else s = digits.slice(0, exp + 1) + "." + digits.slice(exp + 1);
    return (neg ? "-" : "") + s;
  }
  const F = Sk.builtin.float_.prototype, orig = F.str$;
  F.str$ = function (base, sign) {
    if (base !== undefined && base !== 10) return orig.call(this, base, sign);
    const v = this.v;
    if (isNaN(v)) return "nan";
    if (sign === undefined) sign = true;
    if (v === Infinity) return "inf";
    if (v === -Infinity) return sign ? "-inf" : "inf";
    return pyFloatRepr(sign ? v : Math.abs(v));
  };
  // round(x, n) in Skulpt multiplies by 10**n, so round(2.675, 2) gives 2.68. Python rounds the
  // exact stored value (2.67499999…), giving 2.67, and sends exact halves to the even digit.
  const origRound = F.round$;
  F.round$ = function (ndigits) {
    if (ndigits === undefined || ndigits === Sk.builtin.none.none$) return origRound.call(this, ndigits);
    const n = Sk.misceval.asIndexSized(ndigits), x = this.v;
    if (n < 0 || n > 20 || !isFinite(x) || Math.abs(x) >= 1e21) return origRound.call(this, ndigits);
    const a = Math.abs(x);
    let s = a.toFixed(n);
    const exact = a.toFixed(Math.min(100, n + 60)), dot = exact.indexOf(".");
    const tail = exact.slice(dot + 1 + n);
    if (/^50*$/.test(tail)) {
      const down = exact.slice(0, n > 0 ? dot + 1 + n : dot);
      if (+down.slice(-1) % 2 === 0) s = down;
    }
    const r = parseFloat(s);
    return new Sk.builtin.float_(x < 0 || (x === 0 && 1 / x < 0) ? -r : r);
  };
};

        if (word === "TRUE" || word === "FALSE") return "atom";

/* trace table */
const trace = {
  cols: [], rows: [], cur: null, lastRow: -1, dirty: false,
  reset() { this.cols = []; this.rows = []; this.cur = null; this.dirty = true; },
  add(label, value) {
    if (this.rows.length >= 3000) return;
    let ci = this.cols.indexOf(label);
    if (ci < 0) { ci = this.cols.length; this.cols.push(label); }
    if (!this.cur || this.cur[label] !== undefined || (label === "OUTPUT" && this.cur.OUTPUT !== undefined)) { this.cur = {}; this.rows.push(this.cur); }
    this.cur[label] = value; this.lastRow = this.rows.length - 1; this.lastLabel = label; this.dirty = true;
    scheduleRender();
  }
};
let renderPending = false;
function scheduleRender() { if (renderPending) return; renderPending = true; requestAnimationFrame(() => { renderPending = false; renderTrace(); }); }
function renderTrace() {
  const panel = $("#tracePanel");
  if (!trace.rows.length) { panel.innerHTML = `<p class="note">The trace table fills in as the program runs: one column per variable, with a new row each time a value changes. Output goes in the last column.</p>`; return; }
  const cols = trace.cols.filter(c => c !== "OUTPUT"); if (trace.cols.includes("OUTPUT")) cols.push("OUTPUT");
  const start = Math.max(0, trace.rows.length - 400);
  let h = `<table class="tt"><thead><tr><th>#</th>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
  if (start > 0) h += `<tr><td colspan="${cols.length + 1}" style="text-align:left">… ${start} earlier rows hidden</td></tr>`;
  for (let i = start; i < trace.rows.length; i++) {
    const r = trace.rows[i];
    h += `<tr><td>${i + 1}</td>${cols.map(c => { const v = r[c]; const isNew = i === trace.lastRow && c === trace.lastLabel; return `<td class="${c === "OUTPUT" ? "out" : ""}${isNew ? " new" : ""}">${v === undefined ? "" : esc(v)}</td>`; }).join("")}</tr>`;
  }
  if (trace.rows.length >= 3000) h += `<tr><td colspan="${cols.length + 1}" style="text-align:left">Trace stopped recording after 3000 rows.</td></tr>`;
  panel.innerHTML = h + `</tbody></table>`;
  panel.scrollTop = panel.scrollHeight;
}
function renderVars(list) {

}

function doRun() {
  if (state === "idle") return start(false);
  if (state === "paused") { stepping = false; state = "running"; setButtons("running"); setStatus("run", "Running", ""); editor.clearMarks(); releaseStep(); }
}
function doStep() {
  if (state === "idle") return start(true);
  if (state === "running") { stepping = true; usedStep = true; return; }
  if (state === "paused") releaseStep();
}
function stopRun() {
  stopFlag = true;
  if (machine) machine.stop();
  releaseStep();
  if (pendingInput) { const p = pendingInput; pendingInput = null; inrow.classList.remove("on"); p.reject(new Error("__stopped__")); }
}
runBtn.addEventListener("click", doRun);
stepBtn.addEventListener("click", doStep);
stopBtn.addEventListener("click", stopRun);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !(window.CodeMirror && e.target.closest(".CodeMirror"))) { e.preventDefault(); doRun(); }
  if (e.key === "F8" && !(window.CodeMirror && e.target.closest(".CodeMirror"))) { e.preventDefault(); doStep(); }
  if (e.key === "Escape" && state !== "idle") stopRun();
});

async function tickCommon(line, snapshotFn) {
  if (stepping) {
    state = "paused"; setButtons("paused");
    editor.clearMarks(); editor.mark(line, "cur");
    renderVars(snapshotFn());
    setStatus("pause", `Paused at line ${line}`, "This line runs next. Press Step for one line, or Continue to run the rest.");
    await waitStep();
    if (!stopFlag) { state = "running"; if (!stepping) editor.clearMarks(); setButtons(stepping ? "paused" : "running"); }
    return;
  }
  const delay = +$("#speed").value;
  if (delay > 0) {
    editor.clearMarks(); editor.mark(line, "cur"); renderVars(snapshotFn());
    setStatus("run", "Running", `Line ${line}`);
    await sleep(delay);
  }
}

async function start(stepMode) {
  const id = ++runId;
  stopFlag = false; stepping = stepMode; usedStep = stepMode || +$("#speed").value > 0; state = "running";
  editor.clearMarks(); trace.reset(); renderTrace(); renderVars(null); conClear();
  setButtons("running"); setStatus("run", "Running", "");
  const t0 = performance.now();
  try {
    if (lang === "ps") await runPseudo(); else await runPython();
    if (id !== runId) return;
    editor.clearMarks();
    const secs = ((performance.now() - t0) / 1000).toFixed(2);
    setStatus("done", "Finished", usedStep ? `${steps.toLocaleString()} step${steps === 1 ? "" : "s"}.` : `${steps.toLocaleString()} step${steps === 1 ? "" : "s"} in ${secs} s.`);
    if (!con.textContent.trim()) conBlock("The program finished without any output.", "sys");
  } catch (e) {
    if (id !== runId) return;
    editor.clearMarks();
    if (e && (e.__stopped || e.message === "__stopped__" || e instanceof Pseudo.StopSignal)) {
      conBlock("Program stopped.", "sys"); setStatus("ready", "Stopped", `Stopped after ${steps.toLocaleString()} steps.`);
    } else {
      const info = describeError(e);
      conBlock(`<b>${info.line ? `Error on line ${info.line}` : "Error"}</b>${esc(info.msg)}${info.hint ? `<span class="hint">${esc(info.hint)}</span>` : ""}`, "error");
      if (info.line) editor.mark(info.line, "err");
      setStatus("err", info.line ? `Error on line ${info.line}` : "Error", "Fix the highlighted line and run again.");
    }
  } finally {
    if (id === runId) {
      state = "idle"; stepping = false; machine = null; inrow.classList.remove("on"); pendingInput = null;
      setButtons("idle"); renderTrace();
      if (lang === "ps") { saveFiles(); if (currentPanel === "files") renderFiles(); }
    }
  }
}
let steps = 0;

/* ---------------- Pseudocode ---------------- */
async function runPseudo() {
  steps = 0;
  const prog = Pseudo.compile(editor.get());
  machine = new Pseudo.Machine(prog, {
    files,
    output(text) { conText(text + "\n"); },
    async input(label, type) {
      try { return await askInput(`INPUT ${label}${type ? " (" + type + ")" : ""}`); }
      catch (e) { const s = new Error("__stopped__"); s.__stopped = true; throw s; }
    },
    tick(line, m) {
      steps = m.steps;
      if (stopFlag) return;
      if (stepping || +$("#speed").value > 0) return tickCommon(line, () => m.snapshot());
      if (m.steps % 400 === 0) return yieldUI();
    },
    onEvent(e) {
      if (e.type === "assign") trace.add(e.label, Pseudo.show(e.value) || "");
      else if (e.type === "output") trace.add("OUTPUT", e.value);
      else if (e.type === "warn") conBlock(`Line ${e.line}: ${esc(e.msg)}`, "warn");
    }
  });
  const m = machine;
  await m.run();
  renderVars(m.snapshot());
}

/* ---------------- Python (Skulpt) ---------------- */
let pyLoading = null;
function loadPython() {
  if (window.Sk && Sk.builtinFiles) return Promise.resolve();
  if (pyLoading) return pyLoading;
  try { if (new Function("return 2")() !== 2) throw 0; }
  catch (x) { const e = new Error("Python can't run on this copy of the page, because the site hosting it blocks the code compiler Python needs. Download the HTML file and open it in your browser, or host it on GitHub Pages, and Python will work. Pseudocode works here as normal."); e.__load = true; return Promise.reject(e); }
  const note = conBlock("Loading Python for the first time (about 1 MB)…", "sys");
  const load = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.append(s); });
  pyLoading = load("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js")
    .then(() => load("https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"))
    .then(() => { window.patchSkulpt(window.Sk); note.remove(); })
    .catch(() => { pyLoading = null; const e = new Error("Python couldn't be loaded. Check your internet connection, then try again."); e.__load = true; throw e; });
  return pyLoading;
}
function pyRepr(v) {
  try { let s = Sk.misceval.objectRepr(v); if (typeof s !== "string") s = s.v; return s.length > 140 ? s.slice(0, 137) + "…" : s; } catch (e) { return "?"; }
}
function pyType(v) { return (v && v.tp$name) || ""; }
const PY_SKIP = new Set(["function", "module", "type", "builtin_function_or_method", "method"]);
function pyFrames(susp) { const fr = []; let f = susp; while (f) { if (f.$lineno !== undefined && f.$lineno !== null) fr.push(f); f = f.child; } return fr; }
function pySnapshot(fr) {
  const list = []; if (!fr.length) return list;
  const top = fr[fr.length - 1];
  if (fr.length > 1 && top.$tmps) for (const k of Object.keys(top.$tmps)) { if (k[0] === "$") continue; const v = top.$tmps[k]; if (!v || !v.tp$name || PY_SKIP.has(v.tp$name)) continue; list.push({ name: k, scope: "local", type: pyType(v), value: pyRepr(v) }); }
  const g = top.$gbl || fr[0].$gbl;
  if (g) for (const k of Object.keys(g)) { if (k.startsWith("__")) continue; const v = g[k]; if (!v || !v.tp$name || PY_SKIP.has(v.tp$name)) continue; list.push({ name: k, scope: "global", type: pyType(v), value: pyRepr(v) }); }
  return list;
}
async function runPython() {
  steps = 0;
  await loadPython();
  const code = editor.get();
  let prev = new Map(), lineBuf = "", lastSnap = [];
  Sk.configure({
    output: t => { conText(t); lineBuf += t; let i; while ((i = lineBuf.indexOf("\n")) >= 0) { trace.add("OUTPUT", lineBuf.slice(0, i)); lineBuf = lineBuf.slice(i + 1); } },
    read: x => { if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) throw "File not found: '" + x + "'"; return Sk.builtinFiles.files[x]; },
    __future__: Sk.python3,
    inputfunTakesPrompt: true,
    inputfun: (prompt) => {
      if (prompt) conText(String(prompt));
      return askInput("input()").catch(() => { const s = new Error("__stopped__"); s.__stopped = true; throw s; });
    },
    debugging: true,
    breakpoints: () => true,
    execLimit: null
  });
  Sk.execLimit = null;
  const handler = function (susp) {
    if (stopFlag) { const s = new Error("__stopped__"); s.__stopped = true; return Promise.reject(s); }
    steps++;
    if (steps > 3000000) return Promise.reject(Object.assign(new Error("The program was stopped after 3,000,000 steps. Check for a loop that never ends."), { __limit: true }));
    const fr = pyFrames(susp);
    const line = fr.length ? fr[fr.length - 1].$lineno : 0;
    const snap = pySnapshot(fr);
    if (fr.length <= 1) lastSnap = snap;
    const now = new Map();
    for (const v of snap) {
      const key = (v.scope === "local" ? "L:" : "G:") + v.name;
      now.set(key, v.value);
      if (prev.get(key) !== v.value) trace.add(v.scope === "local" ? `${v.name} (local)` : v.name, v.value);
    }
    prev = now;
    const resume = () => susp.resume();
    if (stepping || +$("#speed").value > 0) return tickCommon(line, () => snap).then(() => { if (stopFlag) { const s = new Error("__stopped__"); s.__stopped = true; throw s; } return resume(); });
    if (steps % 300 === 0) return yieldUI().then(resume);
    return Promise.resolve().then(resume);
  };
  const mod = await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true), { "Sk.debug": handler });
  if (lineBuf) trace.add("OUTPUT", lineBuf);
  let fin = lastSnap.filter(v => v.scope === "global");
  try { if (mod && mod.$d) fin = pySnapshot([{ $lineno: 0, $gbl: mod.$d }]); } catch (x) {}
  // record values set by the very last line in the trace table
  for (const v of fin) if (prev.get("G:" + v.name) !== v.value) trace.add(v.name, v.value);
  renderVars(fin);
}

/* ---------------- Errors ---------------- */
const PY_HINTS = {
  NameError: "Check the spelling and capital letters, and make sure the variable is given a value before this line.",
  SyntaxError: "Check for a missing colon at the end of an if, for, while, def or class line, and that every bracket and quote is closed.",
  IndentationError: "Lines inside a block must all be indented by the same amount, usually 4 spaces.",
  TypeError: "You may be mixing types, such as joining a number to a string. Convert with str(…), int(…) or float(…).",
  ValueError: "A value couldn't be converted, for example int() of text that isn't a whole number.",
  IndexError: "A list index is outside the list. Indexes start at 0 and go up to len(list) − 1.",
  KeyError: "That key isn't in the dictionary. Use .get(key) or check with 'in' first.",
  ZeroDivisionError: "Check the value you're dividing by isn't 0.",
  AttributeError: "That object doesn't have this attribute or method. Check the spelling, and that it was set in __init__.",
  RecursionError: "A recursive function needs a base case that stops it calling itself."
};
function pySyntaxHelp(lines, ln) {
  const text = (lines[ln - 1] || "").replace(/#.*$/, "");
  const code = text.trim();
  let prev = ln - 2; while (prev >= 0 && !lines[prev].replace(/#.*$/, "").trim()) prev--;
  const ptext = prev >= 0 ? lines[prev].replace(/#.*$/, "") : "";
  const ind = s => s.match(/^\s*/)[0].length;
  const block = /^(if|elif|else|for|while|def|class|try|except|finally|with)\b/;
  if (prev >= 0 && /:\s*$/.test(ptext) && block.test(ptext.trim()) && ind(text) <= ind(ptext))
    return { line: ln, msg: `IndentationError: expected an indented block after line ${prev + 1}`, hint: "Indent the lines inside the block, usually by 4 spaces." };
  if (block.test(code) && !/:\s*$/.test(code))
    return { line: ln, msg: "SyntaxError: expected ':'", hint: `Add a colon at the end of line ${ln}: lines starting with if, elif, else, for, while, def and class end with :.` };
  let depth = 0, quote = null;
  for (const ch of code) { if (quote) { if (ch === quote) quote = null; continue; } if (ch === '"' || ch === "'") quote = ch; else if ("([{".includes(ch)) depth++; else if (")]}".includes(ch)) depth--; }
  if (quote) return { line: ln, msg: "SyntaxError: unterminated string literal", hint: "A string is missing its closing quote mark." };
  if (depth > 0) return { line: ln, msg: "SyntaxError: '(' was never closed", hint: "A bracket on this line is opened but not closed." };
  if (depth < 0) return { line: ln, msg: "SyntaxError: unmatched ')'", hint: "There is a closing bracket with no matching opening bracket." };
  if (prev >= 0) {
    let d = 0; for (const ch of ptext) { if ("([{".includes(ch)) d++; else if (")]}".includes(ch)) d--; }
    if (d > 0) return { line: prev + 1, msg: "SyntaxError: '(' was never closed", hint: "A bracket on this line is opened but not closed." };
  }
  if (/^(print|input)\s+[^(=]/.test(code)) return { line: ln, msg: "SyntaxError: missing parentheses in call to '" + code.split(/\s/)[0] + "'", hint: "In Python 3, print and input are functions: write print(...)." };
  if (/[^=!<>]=[^=]/.test(code) && /^(if|elif|while)\b/.test(code)) return { line: ln, msg: "SyntaxError: invalid syntax. Maybe you meant '==' instead of '='?", hint: "Use == to compare two values; = stores a value in a variable." };
  return { line: ln, msg: "SyntaxError: invalid syntax", hint: "" };
}
function describeError(e) {
  if (e instanceof Pseudo.PseudoError) return { line: e.line, msg: e.message, hint: e.hint };
  if (e && e.__load) return { line: 0, msg: e.message, hint: "" };
  if (e && e.__limit) return { line: 0, msg: e.message, hint: "" };
  if (window.Sk && e && e.tp$name) {
    let line = 0; try { if (e.traceback && e.traceback.length) line = e.traceback[0].lineno; } catch (x) {}
    let msg = String(e.toString()).replace(/ on line \d+$/, "");
    let name = e.tp$name;
    if (/bad input|EOF in multi-line|bad token/.test(msg)) name = "SyntaxError";
    if (/bad indentation|unindent|expected an indented block|IndentationError/i.test(msg)) name = "IndentationError";
    if (/maximum recursion depth|call stack size/i.test(msg)) { name = "RecursionError"; msg = "RecursionError: maximum recursion depth exceeded"; }
    if (name === "SyntaxError" && /bad input|bad token/.test(msg) && line) {
      const better = pySyntaxHelp(editor.get().split("\n"), line);
      if (better) { msg = better.msg; if (better.line) line = better.line; if (better.hint) return { line, msg, hint: better.hint }; if (/^IndentationError/.test(msg)) name = "IndentationError"; }

}

/* ---------------- Boot ---------------- */
showPanel("trace");
setLang(lang);
setButtons("idle");

})();
